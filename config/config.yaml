/**:
  # Global Parameters
  ros__parameters:
    tf_timeout_threshold: 0.05

/**:
  # Basic Robotics Functions
  # Platform
  platform:
    ros__parameters:
      enable_camera: false
      enable_gimbal: false

  # State Estimator
  state_estimator:
    ros__parameters:
      # Outdoor (GPS) Raw Odometry
      plugin_name: "raw_odometry"
      raw_odometry:
        use_gps: true  # Anchor earth at a GPS datum. By default the first fix received becomes the datum.

        # # Datum pinned to a surveyed point instead of the first fix, so earth lands in the
        # # same place on every flight and GPS waypoints stay comparable across sessions.
        # gps_origin:
        #   set_origin: "manual"
        #   coordinates:
        #     latitude: 40.4168
        #     longitude: -3.7038
        #     altitude: 667.0

        # # Datum supplied at runtime by the set_origin service (drone.gps.set_origin in
        # # as2_python_api). earth->map is not published until it is called, so the TF tree
        # # stays incomplete until then.
        # gps_origin:
        #   set_origin: "service"

        # # Pin map explicitly instead of placing it at the first fix. Composes with use_gps:
        # # GPS still supplies the datum served by get_origin.
        # earth_map_transform:
        #   set_earth_map: true
        #   position:
        #     x: 0.0
        #     y: 0.0
        #     z: 0.0
        #   orientation:
        #     roll: 0.0
        #     pitch: 0.0
        #     yaw: 0.0

      # # IMU fused with odometry (simple_ekf):
      # # Might need sensor_measurements/imu and covariance tuning.
      # plugin_name: "simple_ekf"
      # simple_ekf:
      #   earth_map_transform:
      #     static_tf: true  
      #     set_earth_map: true  # Manually set earth to map transform if true.
      #     position:
      #       x: 0.0
      #       y: 0.0
      #       z: 0.0
      #     orientation:
      #       roll: 0.0
      #       pitch: 0.0
      #       yaw: 0.0
      #   update_topics: ["odom"]
      #   odom:
      #     topic: "sensor_measurements/odom"
      #     type: "nav_msgs/msg/Odometry"
      #     set_earth_map: false  # Dead-reckoned: must not define the world origin.
      #     use_message_covariance: true
      #     position_multiplier: [1.0, 1.0, 1.0]
      #     orientation_multiplier: [1.0, 1.0, 1.0]

  # Behaviors Motion
  TakeoffBehavior:
    ros__parameters:
      takeoff_plugin_name: "takeoff_plugin_platform"
  LandBehavior:
    ros__parameters:
      land_plugin_name: "land_plugin_platform"
  GoToBehavior:
    ros__parameters:
      go_to_plugin_name: "go_to_plugin_position"
      # go_to_plugin_name: "go_to_plugin_trajectory"
  FollowPathBehavior:
    ros__parameters:
      follow_path_plugin_name: "follow_path_plugin_position"
      # follow_path_plugin_name: "follow_path_plugin_trajectory"

  # Trajectory Generation Behavior
  TrajectoryGeneratorBehavior:
    ros__parameters:
      plugin_name: "dynamic_mav_trajectory_generator"

  # Behaviors Perception
  point_gimbal_behavior:
    ros__parameters:
      behavior_timeout: 10.0
      gimbal_name: gimbal
      gimbal_frame_id: gimbal
      gimbal_base_frame_id: gimbal_base
      gimbal_threshold: 0.01

# Specific Parameters for each drone
