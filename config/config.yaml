/**:
  # Global Parameters
  ros__parameters:
    tf_timeout_threshold: 0.05

/**:
  # Basic Robotics Functions
  # Platform
  platform:
    ros__parameters:
      enable_camera: false
      enable_gimbal: false

  # State Estimator
  state_estimator:
    ros__parameters:
      # Outdoor (GPS) Raw Odometry
      plugin_name: "raw_odometry"
      raw_odometry:
        use_gps: true  # Anchor tf tree at a GPS first measurement.

        # # Tf tree is anchored at manually set GPS coordinates.
        # gps_origin:
        #   set_origin: "manual"
        #   coordinates:
        #     latitude: 40.4168
        #     longitude: -3.7038
        #     altitude: 667.0

        # # Tf tree is anchored at GPS coordinates served by a service. The service must be called by the user.
        # gps_origin:
        #   set_origin: "service"

  # Behaviors Motion
  TakeoffBehavior:
    ros__parameters:
      takeoff_plugin_name: "takeoff_plugin_platform"
  LandBehavior:
    ros__parameters:
      land_plugin_name: "land_plugin_platform"
  GoToBehavior:
    ros__parameters:
      go_to_plugin_name: "go_to_plugin_position"
      # go_to_plugin_name: "go_to_plugin_trajectory"
  FollowPathBehavior:
    ros__parameters:
      follow_path_plugin_name: "follow_path_plugin_position"
      # follow_path_plugin_name: "follow_path_plugin_trajectory"

  # Trajectory Generation Behavior
  TrajectoryGeneratorBehavior:
    ros__parameters:
      plugin_name: "dynamic_mav_trajectory_generator"

  # Behaviors Perception
  point_gimbal_behavior:
    ros__parameters:
      behavior_timeout: 10.0
      gimbal_name: gimbal
      gimbal_frame_id: gimbal
      gimbal_base_frame_id: gimbal_base
      gimbal_threshold: 0.01

